name: Build IndoDesk

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  APP_NAME: indodesk

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install vcpkg dependencies
        shell: cmd
        run: |
          C:\vcpkg\vcpkg install libvpx:x64-windows-static libyuv:x64-windows-static opus:x64-windows-static aom:x64-windows-static --classic
        env:
          VCPKG_ROOT: C:\vcpkg
          VCPKG_DISABLE_METRICS: 1

      - name: Build Flutter Windows
        run: |
          flutter pub get
          flutter build windows --release
        working-directory: flutter
        env:
          VCPKG_ROOT: C:\vcpkg

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndoDesk-Windows
          path: flutter/build/windows/x64/runner/Release/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'


      - name: Install system dependencies
        run: |
          brew install nasm yasm cmake pkg-config

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Install vcpkg dependencies
        run: |
          $HOME/vcpkg/vcpkg install libvpx libyuv opus aom --classic --triplet arm64-osx
          $HOME/vcpkg/vcpkg install libvpx libyuv opus aom --classic --triplet x64-osx
        env:
          VCPKG_ROOT: $HOME/vcpkg
          VCPKG_DISABLE_METRICS: 1

      - name: Build Rust library
        run: |
          export PKG_CONFIG_PATH="$HOME/vcpkg/installed/arm64-osx/lib/pkgconfig:$HOME/vcpkg/installed/x64-osx/lib/pkgconfig"
          export OPUS_INCLUDE_DIR="$HOME/vcpkg/installed/arm64-osx/include"
          export OPUS_LIB_DIR="$HOME/vcpkg/installed/arm64-osx/lib"
          cargo build --release
        env:
          VCPKG_ROOT: $HOME/vcpkg
          VCPKG_INSTALLED_DIR: $HOME/vcpkg/installed

      - name: Build Flutter macOS
        run: |
          flutter pub get
          flutter build macos --release
        working-directory: flutter
        env:
          VCPKG_ROOT: $HOME/vcpkg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: IndoDesk-macOS
          path: flutter/build/macos/Build/Products/Release/
